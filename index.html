<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Worklog</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <button id="themeBtn" class="btn">Theme</button>
      </header>
      <nav class="nav" id="nav">
        <button data-tab="overview">Overview</button>
        <button data-tab="projects">Projects</button>
        <button data-tab="tasks">Tasks</button>
        <button data-tab="git">Git Planner</button>
        <button data-tab="activity">Activity Log</button>
        <button data-tab="meetings">Meetings</button>
        <button data-tab="reports">Reports</button>
        <button data-tab="docs">Documentation</button>
      </nav>
      <main id="main"></main>
    </div>
    <dialog id="modal">
      <div class="dialoghead">
        <h2 id="modalTitle"></h2>
        <button type="button" class="btn" id="closeModal">✕</button>
      </div>
      <form id="modalForm">
        <div id="modalFields" class="formgrid"></div>
        <div class="formfoot">
          <button type="button" class="btn" id="cancelModal">Cancel</button>
          <button class="btn primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
